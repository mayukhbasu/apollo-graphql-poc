type Message {
  id: ID!
  content: String!
  author: String!
}

type User {
  id: ID!
  name: String!
  email: String!
}

type Query {
  messages: [Message!]
  user(id: ID!): User
}

type Mutation {
  addMessage(content: String!, author: String!): Message!
  createUser(name: String!, email: String!): User!
}

type Subscription {
  messageAdded: Message!
}

enum UserRole {
  ADMIN
  USER
  GUEST
}

input CreateUserInput {
  name: String!
  email: String!
  role: UserRole!
}
